<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APAGÃO · Arquivo sonoro</title>
<style>
:root{color-scheme:dark;font-family:Georgia,serif;background:#101313;color:#dddcd5}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:48px 24px 120px}.eyebrow{font:11px monospace;letter-spacing:3px;color:#8c9b89}h1{font-weight:400;font-size:clamp(36px,6vw,64px);margin:14px 0}p{color:#a3aaa2;line-height:1.6;max-width:670px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}input,select,button{font:14px system-ui;background:#1b2220;color:#e1e5db;border:1px solid #3e4d43;border-radius:4px;padding:12px}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{background:#2d3c31}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c1cba6;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{padding:22px;background:#171d1a;border:1px solid #303b32;border-radius:6px}.tag{font:10px monospace;text-transform:uppercase;letter-spacing:2px;color:#95ac8d}.card h2{font-size:23px;font-weight:400;margin:14px 0 8px}.card p{font:12px system-ui;margin-bottom:20px}.card button{width:100%}.card button+button{margin-top:8px}.toolbar label{display:flex;align-items:center;gap:10px;font:14px system-ui}.toolbar p{flex-basis:100%;margin:0}.card.playing{border-color:#afbca1;background:#202b22}.player{position:fixed;bottom:0;left:0;right:0;background:#141b17f5;border-top:1px solid #4b5a48;padding:16px max(24px,calc((100vw - 1052px)/2));display:flex;gap:20px;align-items:center}.player strong{font:13px system-ui;min-width:140px}audio{height:36px;flex:1}small{font:12px system-ui;color:#a7b1a3}@media(max-width:600px){.player{flex-wrap:wrap;gap:10px}audio{min-width:100%;height:32px}main{padding-top:28px}}
</style></head><body><main>
<span class="eyebrow">HOSPITAL-COLÔNIA SANTA LÚCIA · 1983</span>
<h1>O hospital escuta.</h1><p>Seis trilhas e um arquivo de presenças, ambientes e sons do Noturno. Ouça cada camada do APAGÃO. No jogo, elas se misturam conforme o lugar, a tensão e o perigo.</p>
<small id="summary">Carregando o arquivo sonoro…</small>
<div class="toolbar"><input id="search" aria-label="Buscar som" placeholder="Buscar som…"><select id="category" aria-label="Categoria"><option value="all">Todos os sons</option><option value="music">Trilhas</option><option value="ambience">Ambientes</option><option value="creature">Criatura</option><option value="effect">Interações e presenças</option><option value="foley">Passos</option><option value="body">Respiração e coração</option><option value="mechanical">Eletricidade e alarme</option></select></div><div class="grid" id="library"></div>
</main><div class="player"><strong id="now">Selecione um som</strong><audio id="player" hidden controls preload="none"></audio></div>
<script type="module">
import {CATALOG} from './catalog.mjs';
const names={score_explore:'O hospital escuta',score_basement:'Abaixo da terra',score_stalk:'Há alguém aqui',score_chase:'Ele viu você',score_finale:'O despertar',score_escape:'A chuva lá fora',amb_hospital:'Corredores vazios',amb_basement:'Subsolo úmido',amb_morgue:'O frio do necrotério',amb_noturna:'A ala noturna',amb_boiler:'Caldeiras antigas',amb_water:'Cisterna alagada',amb_rain:'Chuva no pátio',breath_calm:'Respiração contida',breath_panic:'Respiração em pânico',heartbeat:'Batimento cardíaco',hum_lamp:'Lâmpada defeituosa',hum_flashlight:'Zumbido da lanterna',siren:'Alarme do hospital',burn:'Queimadura pela luz',step_tile:'Passo no linóleo',step_concrete:'Passo no concreto',step_wood:'Passo na madeira',step_water:'Passo na água',creature_step:'Passo do Noturno',gasp:'Fôlego interrompido',click_on:'Ligar a lanterna',click_off:'Desligar a lanterna',flashlight_thump:'Bater na lanterna',overheat:'Superaquecimento',metal_hit:'Pancada no metal',door_slam:'Porta batendo',door_rattle:'Maçaneta trancada',door_creak:'Dobradiça rangendo',door_close:'Fechar a porta',locker_bang:'Pancada no armário',locker_move:'Porta do armário',drawer:'Gaveta do necrotério',pickup_paper:'Papel antigo',pickup_fuse:'Recolher fusível',pickup_key:'Recolher a chave',fuse_insert:'Instalar fusível',lights_on:'Luzes voltando',lamp_burst:'Lâmpada estourando',lever:'Alavanca do gerador',unlock:'Trava da saída',vent_rattle:'Grade do duto',vent_crawl:'Algo nos dutos',whisper:'Sussurros sem origem',radio:'O rádio desperta',drip:'Goteira',spirit_knock:'Batidas dentro da parede',spirit_lament:'Lamento distante',spirit_scrape:'Arranhões do outro lado',blackout:'Queda de energia',stinger:'A descoberta',death:'Ele te pegou',creature_click:'Mandíbula do Noturno',creature_breath:'Respiração do Noturno',creature_sniff:'Ele fareja',creature_pain:'Dor do Noturno',creature_moan:'Gemido do Noturno',creature_growl:'Rosnado do Noturno',creature_roar:'Rugido do Noturno',creature_attack:'Ataque do Noturno',creature_screech:'Grito do Noturno',creature_hiss:'Sibilo do Noturno'};
const types={music:'Trilha',ambience:'Ambiente',creature:'Criatura',effect:'Interação / presença',foley:'Passos',body:'Corpo',mechanical:'Eletricidade'};
Object.assign(names,{step_lino:'Passo no linóleo',step_tile:'Passo na cerâmica',step_stone:'Passo na pedra / granilite',step_brick:'Passo no tijolo',step_asphalt:'Passo no asfalto'});
import {audition,stopAudition} from './audition.js';
const spatial=document.createElement('div');spatial.className='toolbar';spatial.innerHTML='<p>Prévia para fones: seis passos com o volume e a posição 3D do jogo.</p><label>Posição em 3D <select id="direction"><option value="front">À frente</option><option value="right">À direita</option><option value="back">Atrás</option><option value="left">À esquerda</option></select></label><button id="stop3d">Parar prévia 3D</button>';document.querySelector('#library').before(spatial);document.querySelector('#stop3d').onclick=stopAudition;
Object.assign(names,{children_laughter:'Risadas das crianças',toy_music:'O brinquedo desperta',haunt_door_knock:'Alguém bate à porta',morgue_glass:'Copo caindo no necrotério',phantom_step:'Passo fantasma no escuro'});
const manifest=await(await fetch('../../assets/audio/manifest.json')).json();
const files=Object.values(manifest.assets).flat();document.querySelector('#summary').textContent=`${files.length} arquivos · ${(files.reduce((n,e)=>n+e.duration,0)/60).toFixed(1)} minutos · ElevenLabs`;
const player=document.querySelector('#player'),list=document.querySelector('#library');let active=null;const variants=new Map();
function render(){list.replaceChildren();for(const a of CATALOG){if(!manifest.assets[a.id]?.length)continue;const name=names[a.id]||a.id;const needle=document.querySelector('#search').value.toLocaleLowerCase('pt-BR');if(!name.toLocaleLowerCase('pt-BR').includes(needle))continue;const category=document.querySelector('#category').value;if(category!=='all'&&category!==a.type)continue;const card=document.createElement('article');card.className='card'+(active===a.id?' playing':'');const tag=document.createElement('span');tag.className='tag';tag.textContent=types[a.type];const h=document.createElement('h2');h.textContent=name;const detail=document.createElement('p');detail.textContent=`${Number(manifest.assets[a.id][0].duration).toFixed(a.seconds < 3 ? 2 : 0)} segundos${a.loop?' · ambiente contínuo':''}${a.variants>1?' · '+a.variants+' variações':''}`;const button=document.createElement('button');button.textContent=active===a.id?'Recomeçar':'Ouvir';button.onclick=()=>{const entries=manifest.assets[a.id];const variant=variants.get(a.id)||0;variants.set(a.id,(variant+1)%entries.length);stopAudition();player.hidden=false;player.src='../../assets/audio/'+entries[variant].file+'?v='+entries[variant].sha256.slice(0,12);player.loop=a.loop;player.volume=0.75;player.play().catch(()=>{});document.querySelector('#now').textContent=name;active=a.id;render();};card.append(tag,h,detail,button);if(a.footstep){const binaural=document.createElement('button');binaural.textContent='Ouvir em 3D';binaural.onclick=async()=>{player.pause();player.hidden=true;document.querySelector('#now').textContent=name+' · prévia 3D';binaural.textContent='Reproduzindo seis passos…';try{await audition(a.id,document.querySelector('#direction').value,()=>{binaural.textContent='Ouvir em 3D';});}catch{binaural.textContent='Não foi possível tocar';}};card.append(binaural);}list.append(card);}}
player.onplay=stopAudition;if(new URLSearchParams(location.search).has('steps'))document.querySelector('#search').value='Passo';document.querySelector('#search').oninput=render;document.querySelector('#category').onchange=render;render();
</script></body></html>
