# Publica o CLIENTE (pasta dist/) no GitHub Pages a cada push na branch main.
# Configure em: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Opcional: Settings > Secrets and variables > Actions > Variables > APAGAO_SERVER_URL = https://SEU-SERVIDOR.onrender.com
# (e o endereco do servidor multiplayer; NAO e segredo. Se ficar vazio, edite runtime-config.js no repositorio.)
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:client
        env:
          APAGAO_SERVER_URL: ${{ vars.APAGAO_SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
